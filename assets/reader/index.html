<script>
(() => {
  const $ = id => document.getElementById(id);
  const ui = {file:$('file'),page:$('page'),reader:$('reader'),empty:$('empty'),add:$('add'),panel:$('panel'),list:$('list'),editor:$('editor'),thought:$('thought'),count:$('count'),notice:$('notice'),history:$('history'),historyList:$('history-list')};
  let html = '', docTitle = '', fileName = '', currentPath = '', currentIndex = null, key = '', notes = [], chosen = null, pending = null, saveTimer, scrollTimer;
  let source = {title:'',url:''};
  const announce = message => { ui.notice.textContent = message; };
  const hash = text => { let h = 2166136261; for(let i=0;i<text.length;i++){h ^= text.charCodeAt(i);h = Math.imul(h,16777619);} return (h>>>0).toString(36); };
  let historyDb;
  function getHistoryDb(){return historyDb ||= new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return;}
    const request=indexedDB.open('html-reader-history',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('documents',{keyPath:'id'});
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('History database failed'));
  });}
  async function historyStore(mode,action){const db=await getHistoryDb();return new Promise((resolve,reject)=>{const tx=db.transaction('documents',mode),store=tx.objectStore('documents');let result;try{result=action(store);}catch(error){reject(error);return;}tx.oncomplete=()=>resolve(result?.result);tx.onerror=()=>reject(tx.error||new Error('History transaction failed'));});}
  const saveHistory=record=>historyStore('readwrite',store=>store.put(record));
  const readHistory=()=>historyStore('readonly',store=>store.getAll());
  const esc = text => String(text).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const name = suffix => (fileName.replace(/\.(html?|xhtml)$/i,'') || '阅读批注') + suffix;
  function download(blob, filename){ const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000); }
  function item(d,tag,className,value){const node=d.createElement(tag);if(className)node.className=className;if(value!==undefined)node.textContent=String(value);return node;}
  function indexModel(d){
    const script=[...d.scripts].map(s=>s.textContent).find(s=>/\bconst DATA\s*=\s*\[/.test(s));
    if(!script)return null;
    const match=/\bconst DATA\s*=\s*\[/.exec(script);
    const start=script.indexOf('[',match.index);let depth=0,quote='',escaped=false,end=-1;
    for(let i=start;i<script.length;i++){
      const ch=script[i];
      if(quote){if(escaped)escaped=false;else if(ch==='\\')escaped=true;else if(ch===quote)quote='';continue;}
      if(ch==='"'||ch==="'"){quote=ch;continue;}
      if(ch==='[')depth++;else if(ch===']'&&--depth===0){end=i+1;break;}
    }
    if(end<0)return null;
    try{
      const rows=JSON.parse(script.slice(start,end));
      if(!Array.isArray(rows)||!rows.length)return null;
      if(d.getElementById('list')&&rows[0].url!==undefined)return {kind:'svg',rows};
      if(d.getElementById('grid')&&rows[0].h!==undefined)return {kind:'ai',rows};
    }catch{}
    return null;
  }
  function renderIndex(d,model,mode='date'){
    const target=d.getElementById(model.kind==='svg'?'list':'grid');if(!target)return;
    target.replaceChildren();
    const rows=[...model.rows].sort((a,b)=>mode==='views'?(model.kind==='svg'?b.views-a.views:b.v-a.v):(model.kind==='svg'?String(b.date).localeCompare(String(a.date)):String(b.d).localeCompare(String(a.d))));
    if(model.kind==='svg'){
      let year='',rank=0;
      for(const r of rows){
        if(r.year!==year){year=r.year;const band=item(d,'div','year-band');band.append(item(d,'h2','',year),item(d,'span','yc',`${rows.filter(x=>x.year===year).length} 集`));target.append(band);}
        const row=item(d,'div','row'),main=item(d,'div','main'),title=item(d,'div','ttl');
        const link=item(d,r.url?'a':'span',r.url?'':'tbd');if(r.url)link.setAttribute('href',r.url);
        link.append(item(d,'span','zh',r.zh||r.title),item(d,'span','en',r.title));
        title.append(link);main.append(title,item(d,'div','guest',r.guest),item(d,'div','meta',`${r.date} · ${r.dur}`));
        row.append(item(d,'span','rank',String(++rank).padStart(2,'0')),main,item(d,'div','views',`${Number(r.views||0).toLocaleString('zh-CN')} 次`));target.append(row);
      }
      const done=model.rows.filter(r=>r.url).length;
      for(const [id,value] of [['st-total',`共 ${model.rows.length} 集`],['st-done',`已完成 ${done} 集`],['st-todo',`待制作 ${model.rows.length-done} 集`]]){const node=d.getElementById(id);if(node)node.textContent=value;}
    }else{
      for(const r of rows){
        const card=item(d,'div','card'),link=item(d,'a','card-link');link.setAttribute('href',r.h);
        const top=item(d,'div','c-top');top.append(item(d,'span','c-date',r.d),item(d,'span','c-views',`${Number(r.v||0).toLocaleString('zh-CN')} 次观看`));
        link.append(top,item(d,'div','c-zh',r.zh),item(d,'div','c-en',r.en));
        const meta=[r.g&&`嘉宾 ${r.g}`,r.dur].filter(Boolean).join(' · ');
        if(meta)link.append(item(d,'div','c-meta',meta));if(r.b)link.append(item(d,'div','c-blurb',r.b));
        link.append(item(d,'span','c-go','打开学习页 →'));card.append(link);target.append(card);
      }
    }
    const hint=d.getElementById('mode-hint');if(hint)hint.textContent=mode==='date'?'当前：按发布时间倒序':'当前：按公开观看量倒序';
    d.getElementById('tab-date')?.classList.toggle('on',mode==='date');
    d.getElementById('tab-views')?.classList.toggle('on',mode==='views');
  }
  function bindIndex(d,model){if(!model)return;for(const [id,mode] of [['tab-date','date'],['tab-views','views']])d.getElementById(id)?.addEventListener('click',()=>renderIndex(d,model,mode));}
  function safeHtml(source){
    const parser=new DOMParser(), d=parser.parseFromString(source,'text/html');
    const originalTitle=d.querySelector('meta[property="og:title"]')?.content?.trim() || d.querySelector('.sub em')?.textContent?.trim() || d.title || fileName;
    const originalUrl=d.querySelector('a[href*="youtube.com/watch"],a[href*="youtu.be/"]')?.href || d.querySelector('meta[property="og:url"]')?.content || d.querySelector('link[rel="canonical"]')?.href || '';
    const model=indexModel(d);if(model)renderIndex(d,model);
    d.querySelectorAll('script,iframe,frame,object,embed,form,meta[http-equiv="refresh"],base,link[rel="preload"],link[rel="modulepreload"]').forEach(e=>e.remove());
    d.querySelectorAll('*').forEach(el=>{ for(const attr of [...el.attributes]){ const n=attr.name.toLowerCase(),v=attr.value.trim(); if(n.startsWith('on') || (['href','src','action','xlink:href'].includes(n) && /^(javascript:|data:text\/html)/i.test(v))) el.removeAttribute(attr.name); } });
    const style=d.createElement('style');style.textContent='::highlight(reader-note){background:#f2d589;color:inherit} html{scroll-behavior:smooth}';d.head.appendChild(style);
    return {html:'<!doctype html>\n'+d.documentElement.outerHTML,title:d.title || fileName,source:{title:originalTitle,url:originalUrl},indexModel:model};
  }
  function bodyTextNodes(){const d=ui.page.contentDocument;if(!d?.body)return [];const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement?.closest('script,style,noscript')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const out=[];while(walker.nextNode())out.push(walker.currentNode);return out;}
  function offsetAt(node, offset){let total=0;for(const t of bodyTextNodes()){if(t===node)return total+offset;total+=t.length;}return null;}
  function nodeAt(position){let total=0;for(const t of bodyTextNodes()){if(position<=total+t.length)return {node:t,offset:Math.max(0,position-total)};total+=t.length;}return null;}
  function rangeFor(note){const a=nodeAt(note.start),b=nodeAt(note.end),d=ui.page.contentDocument;if(!a||!b)return null;const r=d.createRange();try{r.setStart(a.node,a.offset);r.setEnd(b.node,b.offset);return r;}catch{return null;}}
  function selectedRange(){const d=ui.page.contentDocument,s=d?.getSelection();if(!s||s.isCollapsed||!s.rangeCount)return null;const r=s.getRangeAt(0);if(!d.body.contains(r.commonAncestorContainer))return null;const prefix=d.createRange();prefix.selectNodeContents(d.body);prefix.setEnd(r.startContainer,r.startOffset);const start=prefix.toString().length;return {start,end:start+r.toString().length,text:r.toString().trim(),range:r.cloneRange()};}
  function currentSection(range){let el=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentElement;const section=el?.closest('.round,section,article');return section?.querySelector('.rtitle,h2,h3')?.textContent?.trim() || el?.closest('header')?.querySelector('h1')?.textContent?.trim() || '';}
  function paint(){const d=ui.page.contentDocument;if(!d?.defaultView?.CSS?.highlights)return;const ranges=notes.map(rangeFor).filter(Boolean);d.defaultView.CSS.highlights.set('reader-note',new d.defaultView.Highlight(...ranges));}
  function persist(){try{localStorage.setItem(key,JSON.stringify(notes));announce('');}catch{announce('浏览器无法保存记录，请立即导出 Markdown。');}}
  function render(){ui.count.textContent=`${notes.length} 条划线`;ui.list.innerHTML='';for(const note of notes){const card=document.createElement('div');card.className='note'+(note.id===chosen?' active':'');card.tabIndex=0;card.innerHTML=`<div class="where">${esc(note.section||docTitle)}</div><blockquote>${esc(note.text)}</blockquote><div class="thought">${esc(note.thought||'点击写想法…')}</div>`;card.onclick=()=>select(note.id,true);card.onkeydown=e=>{if(e.key==='Enter')select(note.id,true)};ui.list.appendChild(card);}const active=notes.find(n=>n.id===chosen);ui.editor.classList.toggle('hidden',!active);if(active && document.activeElement!==ui.thought)ui.thought.value=active.thought||'';$('md').disabled=!notes.length;$('allpng').disabled=!notes.length;paint();}
  function select(id,scroll){chosen=id;render();if(scroll){const r=rangeFor(notes.find(n=>n.id===id));r?.startContainer.parentElement?.scrollIntoView({behavior:'smooth',block:'center'});}}
  function openDocument(raw,name,path='',fragment=''){
    if(key){try{localStorage.setItem(key+':scroll',String(ui.page.contentWindow.scrollY||0));}catch{}}
    clearTimeout(scrollTimer);clearTimeout(saveTimer);
    fileName=name;
    const safe=safeHtml(raw);
    html=safe.html;docTitle=safe.title;source=safe.source;currentIndex=safe.indexModel;currentPath=path;key='html-reader:'+hash(raw);
    try{notes=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(notes))notes=[];}catch{notes=[];}
    chosen=null;pending=null;ui.add.classList.remove('show');ui.empty.classList.add('hidden');ui.history.hidden=true;announce('');
    ui.page.onload=()=>{
      const d=ui.page.contentDocument,frame=ui.page.contentWindow,scrollKey=key+':scroll';
      bindDropTarget(d);
      bindIndex(d,currentIndex);
      d.addEventListener('click',followLocalLink,true);
      d.addEventListener('mouseup',showSelection);
      d.addEventListener('keyup',showSelection);
      d.addEventListener('keydown',e=>{if(e.key==='Escape'){ui.add.classList.remove('show');pending=null;}});
      d.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]'))return;const p=d.caretRangeFromPoint?.(e.clientX,e.clientY);if(!p)return;const pos=offsetAt(p.startContainer,p.startOffset);const hit=notes.find(n=>pos>=n.start&&pos<=n.end);if(hit)select(hit.id,false);});
      frame.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{try{localStorage.setItem(scrollKey,String(frame.scrollY||0));}catch{}},250);},{passive:true});
      render();
      try{const previous=Number(localStorage.getItem(scrollKey)||0);frame.requestAnimationFrame(()=>{if(fragment)d.getElementById(fragment)?.scrollIntoView();else if(previous>0)frame.scrollTo(0,previous);});}catch{}
    };
    ui.page.srcdoc=html;
    saveHistory({id:hash(raw),name,title:docTitle,path,raw,lastOpened:Date.now()}).catch(()=>announce('文章已打开，但历史记录保存失败。请保留原 HTML 文件。'));
  }
  async function openFile(file,path='',fragment=''){
    if(!file)return;
    if(!/\.(html?|xhtml)$/i.test(file.name)){announce('请拖入 .html、.htm 或 .xhtml 文件。');return;}
    try{openDocument(await file.text(),file.name,path,fragment);}catch{announce('文件读取失败，请换一个 HTML 文件重试。');}
  }
  function followLocalLink(event){
    const anchor=event.target.closest?.('a[href]');if(!anchor)return;
    const href=anchor.getAttribute('href')?.trim();
    if(!href||href.startsWith('#')||/^[a-z][a-z\d+.-]*:/i.test(href)||href.startsWith('//'))return;
    event.preventDefault();
    announce('这是一条指向其他本地文件的链接。请用右侧「打开」单独导入目标 HTML。');
  }
  async function showHistory(){
    ui.history.hidden=false;ui.historyList.textContent='正在读取历史记录…';
    try{
      const records=(await readHistory()).sort((a,b)=>b.lastOpened-a.lastOpened);
      if(ui.history.hidden)return;
      ui.historyList.replaceChildren();
      if(!records.length){ui.historyList.innerHTML='<p class="history-empty">还没有阅读记录。打开或拖入一篇 HTML 后，它会出现在这里。</p>';return;}
      for(const record of records){
        const item=document.createElement('button');item.className='history-item';
        const title=document.createElement('strong'),detail=document.createElement('span');
        title.textContent=record.title||record.name;detail.textContent=`${record.name} · ${new Date(record.lastOpened).toLocaleString('zh-CN')}`;
        item.append(title,detail);
        item.onclick=()=>{try{openDocument(record.raw,record.name,record.path||'');}catch{announce('这篇历史文章无法打开，请重新导入原文件。');ui.history.hidden=true;}};
        ui.historyList.appendChild(item);
      }
    }catch{ui.historyList.innerHTML='<p class="history-empty">当前浏览器无法读取历史记录。仍可用「打开」或拖入文件阅读。</p>';}
  }
  $('history-open').onclick=showHistory;
  $('history-close').onclick=()=>{ui.history.hidden=true;};
  ui.file.onchange=()=>{const file=ui.file.files?.[0];ui.file.value='';openFile(file);};
  const dropTargets=new WeakSet();
  let dragLeaveTimer;
  function bindDropTarget(target){
    if(!target || dropTargets.has(target))return;
    dropTargets.add(target);
    target.addEventListener('dragover',e=>{
      if(!Array.from(e.dataTransfer?.types||[]).includes('Files'))return;
      e.preventDefault();e.dataTransfer.dropEffect='copy';clearTimeout(dragLeaveTimer);ui.reader.classList.add('dragging');
    });
    target.addEventListener('dragleave',()=>{clearTimeout(dragLeaveTimer);dragLeaveTimer=setTimeout(()=>ui.reader.classList.remove('dragging'),100);});
    target.addEventListener('drop',e=>{
      e.preventDefault();clearTimeout(dragLeaveTimer);ui.reader.classList.remove('dragging');
      openFile(e.dataTransfer?.files?.[0]);
    });
  }
  bindDropTarget(document);
  bindDropTarget(ui.page.contentDocument);
  function showSelection(){pending=selectedRange();if(!pending?.text){ui.add.classList.remove('show');return;}const r=pending.range.getBoundingClientRect(),frame=ui.page.getBoundingClientRect(),host=ui.reader.getBoundingClientRect();ui.add.style.left=Math.max(10,Math.min(host.width-145,frame.left-host.left+r.right+8))+'px';ui.add.style.top=Math.max(10,Math.min(host.height-45,frame.top-host.top+r.bottom+8))+'px';ui.add.classList.add('show');}
  ui.add.onclick=()=>{if(!pending?.text)return;const section=currentSection(pending.range);const note={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),start:pending.start,end:pending.end,text:pending.text,section,thought:'',created:new Date().toISOString()};notes.push(note);notes.sort((a,b)=>a.start-b.start);persist();ui.add.classList.remove('show');ui.page.contentDocument.getSelection()?.removeAllRanges();select(note.id,false);ui.thought.focus();};
  ui.thought.oninput=()=>{const active=notes.find(n=>n.id===chosen);if(!active)return;active.thought=ui.thought.value;persist();clearTimeout(saveTimer);saveTimer=setTimeout(render,350);};
  $('delete').onclick=()=>{notes=notes.filter(n=>n.id!==chosen);chosen=null;persist();render();};
  $('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $('app').requestFullscreen?.();};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){ui.add.classList.remove('show');ui.history.hidden=true;pending=null;if(document.fullscreenElement)document.exitFullscreen();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='o'){e.preventDefault();ui.file.click();}});
  function mdText(){const lines=[`# ${docTitle}`,``,`- 原文标题：${source.title||docTitle}`,`- 原文网址：${source.url||'原 HTML 未提供'}`,`- 本地文件：${fileName}`,`- 导出时间：${new Date().toLocaleString('zh-CN')}`,``];notes.forEach((n,i)=>{lines.push(`## ${i+1}. ${n.section||'划线'}`,``,...n.text.split('\n').map(t=>'> '+t),``,`**我的想法：** ${n.thought||'（未填写）'}`,``);});return lines.join('\n');}
  $('md').onclick=()=>download(new Blob(['\ufeff',mdText()],{type:'text/markdown;charset=utf-8'}),name('_划线与想法.md'));
  function wrap(ctx,text,maxWidth){const rows=[];for(const para of String(text).split('\n')){let row='';for(const ch of para){if(ctx.measureText(row+ch).width>maxWidth&&row){rows.push(row);row=ch;}else row+=ch;}rows.push(row||' ');}return rows;}
  function cardCanvas(items){const w=1200,pad=100,gap=65;const c=document.createElement('canvas'),ctx=c.getContext('2d');const blocks=[];let y=160;for(const n of items){ctx.font='38px "Microsoft YaHei",sans-serif';const quote=wrap(ctx,n.text,w-pad*2-48);ctx.font='30px "Microsoft YaHei",sans-serif';const thought=wrap(ctx,n.thought||'（暂未写想法）',w-pad*2-48);const h=145+quote.length*60+40+thought.length*48+75;blocks.push({n,quote,thought,y,h});y+=h+gap;}c.width=w;c.height=Math.min(30000,Math.max(1600,y+115));ctx.fillStyle='#f5f0e7';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#2b2925';ctx.font='bold 47px "Microsoft YaHei",sans-serif';ctx.fillText('阅读复习卡',pad,93);ctx.font='26px "Microsoft YaHei",sans-serif';ctx.fillStyle='#8a8175';ctx.fillText(docTitle.slice(0,38),pad,132);for(const b of blocks){if(b.y+b.h>c.height-85)break;ctx.fillStyle='#fffdfa';ctx.fillRect(pad,b.y,w-pad*2,b.h);ctx.fillStyle='#9c4937';ctx.fillRect(pad,b.y,7,b.h);let yy=b.y+60;ctx.font='24px "Microsoft YaHei",sans-serif';ctx.fillStyle='#8c7567';ctx.fillText((b.n.section||'摘录').slice(0,48),pad+34,yy);yy+=58;ctx.font='38px "Microsoft YaHei",sans-serif';ctx.fillStyle='#302c27';for(const line of b.quote){ctx.fillText(line,pad+34,yy);yy+=60;}yy+=24;ctx.fillStyle='#d9cfc0';ctx.fillRect(pad+34,yy,w-pad*2-68,2);yy+=55;ctx.font='30px "Microsoft YaHei",sans-serif';ctx.fillStyle='#6d4137';for(const line of b.thought){ctx.fillText(line,pad+34,yy);yy+=48;}}const footer=`原文：${source.title||docTitle}${source.url?'  ·  '+source.url:''}`;let fontSize=20;do{ctx.font=`${fontSize}px "Microsoft YaHei",sans-serif`;fontSize--;}while(ctx.measureText(footer).width>w-pad*2&&fontSize>=11);ctx.fillStyle='#8a8175';ctx.fillText(footer,pad,c.height-45,w-pad*2);return c;}
  function savePng(items,suffix){const canvas=cardCanvas(items);canvas.toBlob(blob=>{if(blob)download(blob,name(suffix));else announce('图片生成失败，请尝试缩短单条内容。');},'image/png');}
  $('onepng').onclick=()=>{const n=notes.find(x=>x.id===chosen);if(n)savePng([n],`_卡片_${notes.indexOf(n)+1}.png`);};
  $('allpng').onclick=()=>{const groups=[],chunk=8;for(let i=0;i<notes.length;i+=chunk)groups.push(notes.slice(i,i+chunk));groups.forEach((g,i)=>setTimeout(()=>savePng(g,`_复习长图_${i+1}.png`),i*350));if(groups.length>1)announce(`将下载 ${groups.length} 张长图；若浏览器拦截多文件下载，请允许此页下载。`);};
})();
</script>
